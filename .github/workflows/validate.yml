name: Validate knowledge atlas

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  repository-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate internal links and topic metadata
        run: python scripts/validate_repository.py
      - name: Validate Python examples
        run: python -m compileall -q examples
