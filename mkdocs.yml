site_name: Engineering Knowledge Atlas
site_description: AI-native engineering, full-stack systems, games, Game AI research, and Japanese
docs_dir: .
exclude_docs: |
  .github/
  library/books/
  library/papers/
theme:
  name: material
  features:
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy
markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
